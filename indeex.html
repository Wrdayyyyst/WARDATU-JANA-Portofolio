                <span class="text-xs bg-rose-700 px-3 py-1.5 rounded-lg group-hover:bg-rose-600">40 Soal</span>

            </div>

            <div id="options-container" class="space-y-3 mb-6">

            </div>

                { q: "Jika wanita haid suci pada waktu Asar (sebelum Maghrib), shalat apa saja yang wajib di-qada?", options: ["Hanya Asar", "Asar dan Dzuhur", "Maghrib dan Isya", "Semua shalat hari itu"], answer: 1 },
                { q: "Jika wanita haid suci pada waktu Isya (sebelum Subuh), shalat apa saja yang wajib di-qada?", options: ["Hanya Isya", "Isya dan Maghrib", "Dzuhur dan Asar", "Semua shalat"], answer: 1 },
                { q: "Bagi wanita Mu'tadah Mumayyizah yang keluar darah >15 hari, cara menentukan haid adalah...", options: ["Dianggap istihadah semua", "Berdasarkan Tamyiz (sifat/warna darah kuat vs lemah)", "Berdasarkan kalender", "Berdasarkan kebiasaan orang lain"], answer: 1 },
                { q: "Sebutkan 3 perbedaan utama antara haid dan istihadah dari sudut pandang shalat!", options: ["Haram shalat vs wajib; mandi besar vs wudhu; hadas besar vs kecil", "Tidak ada bedanya", "Hanya masalah waktu", "Wajib puasa saja"], answer: 0 },
                { q: "Apa hukum membaca Al-Qur'an bagi wanita haid jika niatnya murni membaca Al-Qur'an?", options: ["Boleh", "Haram", "Makruh", "Sunnah"], answer: 1 },
                { q: "Apakah wanita istihadah wajib meng-qada shalat selama masa istihadahnya?", options: ["Wajib", "Tidak wajib", "Sunnah", "Makruh"], answer: 1 },
                { q: "Apa yang wajib dilakukan wanita istihadah pada wudhunya setiap kali hendak shalat fardu?", options: ["Membersihkan kemaluan, membalut, lalu berwudhu setelah masuk waktu", "Cukup wudhu biasa", "Mandi wajib", "Tayammum"], answer: 0 },
                { q: "Apakah wanita haid boleh melakukan sujud tilawah atau sujud syukur?", options: ["Boleh", "Haram / Tidak sah", "Makruh", "Sunnah"], answer: 1 },
                { q: "Jika jemaah haji meninggalkan salah satu Rukun Haji, bagaimanakah status hajinya?", options: ["Sah tapi bayar dam", "Tidak sah dan tidak bisa diganti dam (wajib ulang)", "Makruh", "Sah dengan denda"], answer: 1 },
                { q: "Sebutkan 5 hal yang termasuk dalam Wajib Haji!", options: ["Ihram miqat, Mabit Muzdalifah, Mabit Mina, Melontar Jumrah, Thawaf Wada'", "Niat, Shalat, Puasa, Zakat, Haji", "Ihram, Wukuf, Thawaf, Sa'i, Tertib", "Thawaf, Sa'i, Wukuf, Tahallul, Tertib"], answer: 0 },
                { q: "Jemaah haji yang memilih Haji Tamattu' atau Qiran dikenakan denda wajib berupa...", options: ["Dam Nusuk / Dam Ta'attud (menyembelih kambing/puasa 10 hari)", "Bayar uang tunai", "Puasa 3 hari saja", "Tidak ada dam"], answer: 0 },
                { q: "Bagaimana pembagian puasa 10 hari sebagai pengganti dam bagi haji Tamattu'?", options: ["5 hari di Makkah, 5 hari di rumah", "3 hari di Makkah/ihram, 7 hari setelah kembali ke tanah air", "10 hari berturut-turut di Arafah", "Bebas kapan saja"], answer: 1 },
                { q: "Apakah hukum memotong kuku, mencukur rambut, dan memakai wewangian saat berihram?", options: ["Mubah", "Haram (larangan ihram)", "Sunnah", "Makruh"], answer: 1 },
                { q: "Denda (dam) akibat melanggar larangan ihram ringan seperti mencukur rambut/kuku adalah...", options: ["Dam Tamattu'", "Dam Takhyir Takdil (memilih: kambing/6 miskin/puasa 3 hari)", "Dam Fidyah murni", "Dam Jima'"], answer: 1 },
                { q: "Miqat makani bagi jemaah haji Indonesia yang mendarat/berangkat dari Jeddah adalah...", options: ["Jeddah / Yalamlam", "Bir Ali", "Qarnul Manazil", "Zulhulaifah"], answer: 0 },
                { q: "Miqat makani bagi jemaah haji gelombang I dari Madinah adalah...", options: ["Jeddah", "Bir Ali (Zulhulaifah)", "Yalamlam", "Qarnul Manazil"], answer: 1 },
                { q: "Jika wanita haid hendak Thawaf Ifadah dan rombongannya harus pulang, pendapat fikih mana yang memperbolehkan minum obat penahan haid/balut rapat?", options: ["Mazhab Hanbali / Ibnu Taimiyah", "Mazhab Syafi'i mutlak", "Mazhab Maliki", "Mazhab Hanafi"], answer: 0 },
                { q: "Sebutkan denda (dam) bagi jemaah haji yang membunuh hewan buruan saat berihram di Tanah Haram!", options: ["Menyembelih hewan ternak seimbang / senilai, atau sedekah makanan, atau puasa", "Membayar uang denda ke panitia", "Haji batal seketika", "Cukup istighfar"], answer: 0 },
                { q: "Disebut apakah batas wilayah suci kota Makkah dan Madinah yang dilarang berburu?", options: ["Tanah Haram", "Tanah Halal", "Muzdalifah", "Mina"], answer: 0 },
                { q: "Apakah sah sa'i seseorang jika dilakukan SEBELUM melakukan Thawaf Ifadah/Qudum?", options: ["Sah", "Tidak sah (Sa'i wajib setelah thawaf)", "Makruh", "Sunnah"], answer: 1 },
                { q: "Sebutkan 2 tempat mabit (bermalam) yang hukumnya termasuk Wajib Haji!", options: ["Muzdalifah dan Mina", "Arafah dan Makkah", "Makkah dan Madinah", "Safa dan Marwah"], answer: 0 },
                { q: "Kapan waktu pelaksanaan mabit di Muzdalifah?", options: ["Malam 10 Zulhijah (setelah wukuf)", "Malam 9 Zulhijah", "Tanggal 12 Zulhijah", "Sepanjang hari"], answer: 0 },
                { q: "Apa hukumnya jika jemaah haji sengaja melewati miqat tanpa berihram lalu berniat di Makkah?", options: ["Berdosa dan wajib bayar dam (atau kembali ke miqat)", "Sah-sah saja", "Haji batal", "Hanya makruh"], answer: 0 },
                { q: "Disebut apakah pakaian ihram bagi wanita saat melaksanakan ibadah haji/umrah?", options: ["Pakaian menutup seluruh aurat kecuali muka dan telapak tangan", "Harus putih polos tanpa jahitan", "Bebas warna apa saja", "Mukena khusus"], answer: 0 },
                { q: "Apakah wanita ihram dibolehkan memakai cadar (penutup wajah) dan sarung tangan?", options: ["Boleh", "Haram / Tidak dibolehkan", "Makruh", "Sunnah"], answer: 1 },
                { q: "Apakah hukum melaksanakan Thawaf Wada' bagi wanita haid saat hendak meninggalkan Makkah?", options: ["Wajib dibayar dam", "Gugur kewajibannya (tidak wajib & tidak kena dam)", "Tetap wajib thawaf", "Harus minum obat"], answer: 1 },
                { q: "Sebutkan tempat melontar jumrah yang paling pertama dilontar pada hari-hari Tasyrik!", options: ["Jumrah Aqabah", "Jumrah Wusta", "Jumrah Ula (Sugra)", "Semua bebas"], answer: 2 },
                { q: "Disebut apakah shalat sunnah yang dikerjakan saat berpakaian ihram sebelum berniat ihram di miqat?", options: ["Shalat Tahiyatul Masjid", "Shalat Sunnah Ihram (2 rakaat)", "Shalat Mutlak", "Shalat Safar"], answer: 1 }
            ]
        };

        let currentLevel = '';
        let currentIndex = 0;
        let score = 0;
        let activeQuestions = [];

        function startQuiz(level) {
            currentLevel = level;
            activeQuestions = [...quizData[level]];
            currentIndex = 0;
            score = 0;

            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            const q = activeQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Soal ${currentIndex + 1} dari ${activeQuestions.length}`;
            document.getElementById('score-display').innerText = `Skor: ${score}`;
            document.getElementById('question-text').innerText = q.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-700/60 hover:bg-teal-700/40 border border-teal-500/20 transition duration-200 text-slate-200 font-medium cursor-pointer";
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectAnswer(selectedIndex, selectedBtn) {
            const q = activeQuestions[currentIndex];
            const buttons = document.getElementById('options-container').children;

            for (let btn of buttons) {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
                btn.classList.remove('cursor-pointer');
            }

            if (selectedIndex === q.answer) {
                selectedBtn.classList.remove('bg-slate-700/60', 'hover:bg-teal-700/40');
                selectedBtn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-400');
                score += 10;
            } else {
                selectedBtn.classList.remove('bg-slate-700/60', 'hover:bg-teal-700/40');
                selectedBtn.classList.add('bg-rose-600', 'text-white', 'border-rose-400');
                
                buttons[q.answer].classList.remove('bg-slate-700/60', 'hover:bg-teal-700/40');
                buttons[q.answer].classList.add('bg-emerald-600', 'text-white', 'border-emerald-400');
            }

            document.getElementById('score-display').innerText = `Skor: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            const maxScore = activeQuestions.length * 10;
            document.getElementById('final-score').innerText = `Skor Akhir: ${score} dari ${maxScore}`;

            let msg = "";
            const percentage = (score / maxScore) * 100;
            if (percentage === 100) {
                msg = "Luar biasa! Kamu menguasai materi fikih Qurban, Haid & Haji dengan sempurna!";
            } else if (percentage >= 75) {
                msg = "Hebat sekali! Pemahaman fikihmu sudah sangat matang.";
            } else if (percentage >= 50) {
                msg = "Bagus! Terus tingkatkan dan pelajari materi yang masih keliru ya.";
            } else {
                msg = "Tetap semangat! Ayo ulas kembali materi Qurban, Haid, dan Hajinya.";
            }
            document.getElementById('result-message').innerText = msg;
        }

        function resetToMenu() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
        }
    </script>
</body>
</html>
